name: second_times_the_charm
description: "EveryAI in your pocket"

# Prevent accidental publication to pub.dev
publish_to: 'none'

# Application version
version: 0.0.1+1

# Dart SDK version
environment:
  sdk: ">=3.0.0 <4.0.0"

# Application dependencies
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2  # HTTP package for making network requests
  provider: ^6.0.5 # State management package
  flutter_secure_storage: ^9.2.2 # Updated version for secure storage
  cupertino_icons: ^1.0.8 # Icons for iOS
  google_sign_in: ^6.2.2 # Google Sign-In package
  flutter_markdown: ^0.7.4+3 # markdown parser
  flutter_tex: ^4.0.9 # flutter tex
  sqflite: ^2.4.1 #sqite support 8===D
  path: ^1.9.0 # idk why, the sql thing wants this

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # Recommended linting rules

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/


  fonts:
    # NotoSans Font Family
    - family: NotoSans
      fonts:
        - asset: lib/fonts/Noto_Sans/static/NotoSans-Regular.ttf
        - asset: lib/fonts/Noto_Sans/static/NotoSans-Bold.ttf
          weight: 700
        - asset: lib/fonts/Noto_Sans/static/NotoSans-Italic.ttf
          style: italic
        - asset: lib/fonts/Noto_Sans/static/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic

    # EB Garamond Font Family
    - family: EBGaramond
      fonts:
        - asset: lib/fonts/EB_Garamond/static/EBGaramond-Regular.ttf
        - asset: lib/fonts/EB_Garamond/static/EBGaramond-Bold.ttf
          weight: 700
        - asset: lib/fonts/EB_Garamond/static/EBGaramond-Italic.ttf
          style: italic
        - asset: lib/fonts/EB_Garamond/static/EBGaramond-BoldItalic.ttf
          weight: 700
          style: italic

    # Source Code Pro Font Family (Monospace)
    - family: SourceCodePro
      fonts:
        - asset: lib/fonts/Source_Code_Pro/static/SourceCodePro-Regular.ttf
        - asset: lib/fonts/Source_Code_Pro/static/SourceCodePro-Bold.ttf
          weight: 700
        - asset: lib/fonts/Source_Code_Pro/static/SourceCodePro-Italic.ttf
          style: italic
        - asset: lib/fonts/Source_Code_Pro/static/SourceCodePro-BoldItalic.ttf
          weight: 700
          style: italic

    # Philosopher Font Family
    - family: Philosopher
      fonts:
        - asset: lib/fonts/Philosopher/Philosopher-Regular.ttf
        - asset: lib/fonts/Philosopher/Philosopher-Bold.ttf
          weight: 700
        - asset: lib/fonts/Philosopher/Philosopher-Italic.ttf
          style: italic
        - asset: lib/fonts/Philosopher/Philosopher-BoldItalic.ttf
          weight: 700
          style: italic

  # Uncomment and add assets as needed
  # assets:
  #   - images/
  #   - assets/

#   Uncomment to define custom fonts
#   fonts:
#     - family: YourFontFamily
#       fonts:
#         - asset: fonts/YourFont-Regular.ttf
#         - asset: fonts/YourFont-Bold.ttf
#           weight: 700

