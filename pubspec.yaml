name: second_times_the_charm
description: "Second Iteration"

# Prevent accidental publication to pub.dev
publish_to: 'none'

# Application version
version: 1.0.0+1

# Dart SDK version
environment:
  sdk: ">=3.0.0 <4.0.0"

# Application dependencies
dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5  # HTTP package for making network requests
  provider: ^6.0.5 # State management package
  flutter_secure_storage: ^8.1.0 # Updated version for secure storage
  cupertino_icons: ^1.0.8 # Icons for iOS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # Recommended linting rules

flutter:
  uses-material-design: true

  # Uncomment and add assets as needed
  # assets:
  #   - images/
  #   - assets/

  # Uncomment to define custom fonts
  # fonts:
  #   - family: YourFontFamily
  #     fonts:
  #       - asset: fonts/YourFont-Regular.ttf
  #       - asset: fonts/YourFont-Bold.ttf
  #         weight: 700