# Signed release builds. Push a v* tag (or run by hand) →
#   macOS: Developer ID signed, notarized, stapled DMG (frontend/macos/scripts/release_macos.sh)
#   Windows: the Store MSIX (the Store re-signs it; uploaded to Partner Center and submitted for certification)
#   Linux: AppImage + .deb with GPG signatures and SHA256SUMS (packaging/linux/package.sh)
#   In-app updates: appcast.xml (Sparkle) and SHA256SUMS.sig (AppImage), signed with UPDATE_ED25519_KEY
#   (packaging/updates.py). Bump the pubspec build number (+N) every release: Sparkle compares it.
# The DMG and the Linux files land in a draft GitHub Release for the tag.
#
# Secrets (gh secret set …): MACOS_CERT_P12 (base64 .p12 with the Developer ID key), MACOS_CERT_PASSWORD,
# MACOS_PROVISION_PROFILE (base64 Developer ID profile), ASC_KEY_P8 (base64 AuthKey_*.p8), ASC_KEY_ID, ASC_ISSUER_ID;
# MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET, MSSTORE_SELLER_ID, MSSTORE_PRODUCT_ID;
# LINUX_GPG_KEY (armored secret key), LINUX_GPG_PASSPHRASE, LINUX_GPG_KEY_ID (fingerprint);
# UPDATE_ED25519_KEY (base64 Ed25519 seed; public key in Info.plist SUPublicEDKey and updates/update_key.dart).
name: Release (signed)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api:
        description: Backend the builds talk to
        default: https://everyai.136-108-68-64.sslip.io:8443

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9
  EVERYAI_API: ${{ inputs.api || 'https://everyai.136-108-68-64.sslip.io:8443' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$MACOS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/everyai.provisionprofile"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign, notarize
        env:
          PROVISION_PROFILE: ${{ runner.temp }}/everyai.provisionprofile
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: frontend/macos/scripts/release_macos.sh
      # The in-app updater (Sparkle) reads this release's appcast: the DMG's EdDSA signature and build number.
      - name: Sparkle appcast
        env:
          UPDATE_ED25519_KEY: ${{ secrets.UPDATE_ED25519_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages cryptography 2>/dev/null || python3 -m pip install --quiet cryptography
          V="$(grep -m1 '^version:' frontend/pubspec.yaml | sed 's/version: *//; s/+.*//')"
          B="$(grep -m1 '^version:' frontend/pubspec.yaml | sed 's/.*+//')"
          TAG="${GITHUB_REF_NAME}"; [[ "$TAG" == v* ]] || TAG="v$V"
          python3 packaging/updates.py appcast frontend/build/dist/EveryAI-$V.dmg "$V" "$B" "$TAG" "$GITHUB_REPOSITORY" \
            > frontend/build/dist/appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: everyai-macos
          path: frontend/build/dist/*
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/everyai.provisionprofile"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Defines
        run: |
          printf '{"API_BASE_URL":"%s","DEV_SKIP_AUTH":true,"SSE_ENABLED":true,"GOOGLE_SERVER_CLIENT_ID":""}\n' \
            "$EVERYAI_API" > "$RUNNER_TEMP/defines.json"
      - run: flutter pub get
      - run: flutter build windows --release --dart-define-from-file="$RUNNER_TEMP/defines.json"
      - name: Bundled server
        # Next to EveryAI.exe, where findLocalBackend looks (runs local-model and own-key chats).
        run: cp -f "$(tool/build_local_backend.sh x86_64-windows | tail -1)" build/windows/x64/runner/Release/everyai-backend.exe
      - name: Store MSIX
        run: |
          # The Store wants a.b.c.0 and each package higher than the last, but a.b.c alone can't tell
          # 0.1.0-alpha.2 from 0.1.0-alpha.3. So the third part is pubspec's build number (+N, raised every release):
          # 0.1.0-alpha.3+4 -> 0.1.4.0.
          VERSION_LINE="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//')"
          MAJOR_MINOR="$(printf '%s' "$VERSION_LINE" | cut -d. -f1-2)"
          BUILD="${VERSION_LINE##*+}"
          V="$(printf '%s' "$VERSION_LINE" | sed 's/+.*//')"
          dart run msix:create --store --build-windows false --version "$MAJOR_MINOR.$BUILD.0" \
            --output-path build/dist --output-name "EveryAI-$V"
      - uses: actions/upload-artifact@v4
        with:
          name: everyai-windows-store
          path: frontend/build/dist/*.msix
          if-no-files-found: error
      # Uploads the MSIX as a new submission (the listing carries over from the last one) and commits it, so the
      # Store certifies and publishes it with no step in Partner Center.
      - uses: microsoft/setup-msstore-cli@v1
      # Fails while a submission made in the Partner Center web UI is open (the CLI can't add packages to it): then
      # delete that draft or upload the MSIX from the run's artifacts by hand. Never blocks the GitHub Release.
      - name: Submit to the Microsoft Store
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          msstore reconfigure --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" \
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
          msstore publish "$(ls build/dist/*.msix | head -1)" --appId "${{ secrets.MSSTORE_PRODUCT_ID }}"

  linux:
    # 22.04: the oldest supported glibc we build against, so the AppImage runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libsqlite3-dev libfuse2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: frontend
        run: |
          printf '{"API_BASE_URL":"%s","DEV_SKIP_AUTH":true,"SSE_ENABLED":true,"GOOGLE_SERVER_CLIENT_ID":""}\n' \
            "$EVERYAI_API" > "$RUNNER_TEMP/defines.json"
          flutter pub get
          flutter build linux --release --dart-define-from-file="$RUNNER_TEMP/defines.json"
      - name: Package and sign
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          UPDATE_KEY: ${{ secrets.UPDATE_ED25519_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg.pass"
          export GPG_PASSPHRASE_FILE="$RUNNER_TEMP/gpg.pass"
          printf '%s' "$LINUX_GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase-file "$GPG_PASSPHRASE_FILE" --import
          V="$(grep -m1 '^version:' frontend/pubspec.yaml | sed 's/version: *//; s/+.*//')"
          packaging/linux/package.sh frontend/build/linux/x64/release/bundle "$V" frontend/build/dist
          # The AppImage updater checks this Ed25519 signature of SHA256SUMS before swapping itself.
          python3 -m pip install --quiet cryptography
          UPDATE_ED25519_KEY="$UPDATE_KEY" python3 packaging/updates.py sign frontend/build/dist/SHA256SUMS \
            > frontend/build/dist/SHA256SUMS.sig
          gpg --batch --verify frontend/build/dist/SHA256SUMS.asc frontend/build/dist/SHA256SUMS
          rm -rf "$GNUPGHOME" "$GPG_PASSPHRASE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: everyai-linux
          path: frontend/build/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "EveryAI $GITHUB_REF_NAME" \
            --notes "macOS: signed and notarized DMG. Windows: install from the Microsoft Store. Linux: AppImage or .deb; verify with the key in packaging/linux/everyai-release-key.asc (gpg --verify SHA256SUMS.asc SHA256SUMS && sha256sum -c SHA256SUMS)." \
            dist/*.dmg dist/*.dmg.sha256 dist/appcast.xml dist/*.AppImage dist/*.deb dist/SHA256SUMS dist/SHA256SUMS.sig dist/*.asc
