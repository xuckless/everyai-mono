model = "gpt-6"
[profiles.fast]
model = "mini"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]   # comment
enabled = true

[mcp_servers."my.server"]
command = "uvx"
args = [
  "tool",
  "--flag",
]
[mcp_servers."my.server".env]
API_KEY = "abc"
MODE = 'literal'

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
bearer_token_env_var = "FIGMA_TOKEN"
http_headers = { "X-Region" = "us", "X-Other" = "1" }

[mcp_servers.broken]
command = """multi
line"""

[other]
x = 1
