name: every_ai
description: "EveryAI: every AI model in one app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Pub workspace: the app is the root, reusable libraries live in packages/.
workspace:
  - packages/everyai_markdown

dependencies:
  flutter:
    sdk: flutter

  # Design systems (decoupled from the framework since Flutter 3.47)
  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5
  cupertino_icons: ^1.0.8 # glyph font used by cupertino_ui's CupertinoIcons
  material_new_shapes: ^1.0.0
  fluent_ui: ^4.17.0
  macos_ui: ^2.2.2
  macos_window_utils: ^1.9.1
  window_manager: ^0.5.2

  # State, routing, data
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

  # Networking: per-platform HTTP clients (HTTP/2 + HTTP/3 where the OS stack supports it)
  http: ^1.6.0
  cupertino_http: ^3.1.0
  cronet_http: ^1.10.1
  fetch_client: ^1.2.1

  # Auth / platform services
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3

  everyai_markdown:
  flutter_svg: ^2.3.2
  fl_chart: ^1.3.0
  flutter_inappwebview: ^6.1.5
  file_selector: ^1.1.0
  archive: ^4.5.2
  crypto: ^3.0.6
  web_socket_channel: ^3.0.3
  desktop_drop: ^0.8.4
  pdf: ^3.13.1
  markdown: ^7.3.1
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
    - assets/fonts/NotoSans/
    - assets/brand/logo/
    - assets/brand/empty/
    - assets/brand/fields/
    - assets/brand/textures/
    - assets/web/
    - assets/legal/
    - assets/agents/
    - assets/skills/draw-diagram/
    - assets/skills/make-deck/
    - assets/skills/vector-art/
    - assets/skills/write-artifact/
  fonts:
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro/SourceCodePro-Regular.ttf
        - asset: assets/fonts/SourceCodePro/SourceCodePro-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceCodePro/SourceCodePro-Italic.ttf
          style: italic

# Native launch screens (iOS, Android), from the brand kit. Regenerate with
# `dart run flutter_native_splash:create`. These images aren't Flutter assets.
flutter_native_splash:
  color: "#FAFAFE"
  image: assets/brand/splash/splash-mark-light-864.png
  color_dark: "#000000"
  background_image_dark: assets/brand/splash/splash-bg-dark.png
  image_dark: assets/brand/splash/splash-mark-dark-864.png
  android_12:
    image: assets/brand/splash/android12-splash-icon-1152.png
    color: "#000000"
    image_dark: assets/brand/splash/android12-splash-icon-1152.png
    color_dark: "#000000"
  web: false
