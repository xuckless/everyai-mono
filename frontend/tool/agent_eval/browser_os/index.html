<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AetherOS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--accent:#7c9cff;--glass:rgba(22,24,38,.72);--glass2:rgba(40,44,66,.8);--txt:#eef0ff;--dim:#9aa0c0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:#000;user-select:none}
#wall{position:fixed;inset:0;width:100%;height:100%}
#desktop{position:fixed;inset:0 0 48px 0}
.icons{position:absolute;left:14px;top:14px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);gap:6px 4px;height:calc(100% - 20px)}
.icon{width:84px;height:88px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;text-shadow:0 1px 4px #000a}
.icon:hover{background:rgba(255,255,255,.14)}
.icon .g{font-size:34px;filter:drop-shadow(0 2px 4px #0008)}
.icon span{font-size:12px;text-align:center}
.win{position:absolute;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;min-width:240px;min-height:160px}
.win.focus{border-color:rgba(255,255,255,.32);box-shadow:0 22px 60px rgba(0,0,0,.65)}
.win.min{display:none}
.win.max{border-radius:0}
.tb{height:36px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:rgba(255,255,255,.06);cursor:grab;flex:none}
.tb .t{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--txt);cursor:pointer;font-size:14px}
.tb button:hover{background:rgba(255,255,255,.16)}
.tb button.x:hover{background:#e5484d}
.body{flex:1;position:relative;overflow:hidden;min-height:0;user-select:text}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}
#taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--glass);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:99999}
#start{height:34px;padding:0 14px;border:0;border-radius:9px;background:var(--accent);color:#0b1030;font-weight:700;cursor:pointer}
.tbtn{height:34px;padding:0 12px;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:var(--txt);cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn.on{background:rgba(255,255,255,.22);box-shadow:inset 0 -2px 0 var(--accent)}
#tasks{display:flex;gap:6px;flex:1;overflow:hidden}
#clock{padding:0 10px;text-align:right;font-size:12px;line-height:1.2}
#menu{position:fixed;left:8px;bottom:56px;width:300px;background:var(--glass2);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px;display:none;z-index:99999;box-shadow:0 20px 60px #000a}
#menu.open{display:block}
#menu .it{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer}
#menu .it:hover{background:rgba(255,255,255,.12)}
#menu h4{margin:4px 10px 8px;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
/* shared app styles */
.pad{padding:14px;height:100%;overflow:auto}
input,select,textarea,button.b{font:inherit;color:var(--txt);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 10px;outline:none}
button.b{cursor:pointer}button.b:hover{background:rgba(255,255,255,.2)}
button.b.pri{background:var(--accent);color:#0b1030;border:0;font-weight:700}
canvas.game{width:100%;height:100%;display:block;outline:none;background:#000}
.hud{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
/* messages */
.msg{display:flex;height:100%}
.msg .l{width:230px;border-right:1px solid rgba(255,255,255,.1);overflow:auto;flex:none}
.msg .th{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.msg .th:hover,.msg .th.on{background:rgba(255,255,255,.1)}
.msg .th b{display:flex;justify-content:space-between;font-size:13px}.msg .th b i{font-style:normal;color:var(--dim);font-weight:400;font-size:11px}
.msg .th p{margin:2px 0 0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .r{flex:1;display:flex;flex-direction:column;min-width:0}
.msg .log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:80%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;user-select:text}
.bub.me{align-self:flex-end;background:var(--accent);color:#0b1030;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.65;font-size:11px;margin-top:3px}
.msg form{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.1)}.msg form input{flex:1}
/* terminal */
.term{background:#0a0c14e0;color:#b6ffb6;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;height:100%;overflow:auto;white-space:pre-wrap;user-select:text}
.term input{background:none;border:0;color:#fff;font:inherit;width:70%;padding:0}
/* calc */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;height:100%;grid-template-rows:80px repeat(5,1fr)}
.calc .scr{grid-column:1/-1;background:rgba(0,0,0,.35);border-radius:10px;padding:8px 12px;text-align:right;font-size:28px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.calc .scr small{font-size:13px;color:var(--dim);min-height:18px}
.calc button{font-size:18px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:var(--txt);cursor:pointer}.calc button:hover{background:rgba(255,255,255,.24)}.calc button.op{background:rgba(124,156,255,.4)}.calc button.eq{background:var(--accent);color:#0b1030}
/* paint, notes */
.tools{display:flex;gap:8px;padding:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.1)}
.notes textarea{width:100%;height:100%;border:0;border-radius:0;background:transparent;resize:none;padding:14px;font-size:15px;user-select:text}
/* rewind */
.rw{padding:16px;display:flex;flex-direction:column;gap:12px;height:100%}
.rw input[type=range]{width:100%;accent-color:var(--accent)}
.rw .ev{flex:1;overflow:auto;background:rgba(0,0,0,.25);border-radius:10px;padding:6px}
.rw .ev div{padding:3px 8px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;color:var(--dim)}
.rw .ev div.cur{background:rgba(124,156,255,.35);color:#fff}
.rw .ev div:hover{background:rgba(255,255,255,.12)}
.set label{display:block;margin:12px 0 4px;color:var(--dim);font-size:12px}
.set .row{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--glass2);padding:8px 16px;border-radius:20px;z-index:999999;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(10px)}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="wall"></canvas>
<div id="desktop"><div class="icons" id="icons"></div></div>
<div id="menu"></div>
<div id="taskbar"><button id="start">&#9672; Aether</button><div id="tasks"></div><div id="clock"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   AetherOS — a single-file browser OS.
   Sections: utils · wallpaper · window manager · rewind (special) ·
   apps (messages, notes, terminal, calculator, paint, settings, rewind) ·
   tiny WebGL engine · Neon Streets (GTA-style) · Stardust Hop (planet game)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const k in props){if(k==='style')e.style.cssText=props[k];else if(k==='class')e.className=props[k];else if(k.startsWith('on'))e[k]=props[k];else e.setAttribute(k,props[k])}kids.flat().forEach(c=>e.append(c));return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return(h^h>>>16)>>>0}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1800)}
const store={get(k,d){try{const v=localStorage.getItem('aether.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('aether.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------------- Procedural animated wallpaper ---------------- */
const Wall={canvas:$('#wall'),W:224,H:126,style:store.get('wall.style',0),seed:store.get('wall.seed','aether'),speed:store.get('wall.speed',1),t:0,P:null,
 setup(){this.canvas.width=this.W;this.canvas.height=this.H;this.ctx=this.canvas.getContext('2d');this.img=this.ctx.createImageData(this.W,this.H);this.reseed()},
 reseed(){const r=mulberry(hashStr(this.seed+':'+this.style));const R=(a,b)=>a+(b-a)*r();
  this.P={fx:R(2,5),fy:R(2,5),gx:R(3,7),gy:R(3,7),wa:R(1,3),wb:R(1,3),s1:R(.1,.3),s2:R(.1,.25),s3:R(.1,.3),
   pa:[R(.3,.6),R(.3,.6),R(.3,.6)],pb:[R(.3,.6),R(.3,.6),R(.3,.6)],pc:[R(.6,1.4),R(.6,1.4),R(.6,1.4)],pd:[r(),r(),r()],
   cx:[R(.2,.8),R(.2,.8),R(.2,.8)],cy:[R(.2,.8),R(.2,.8),R(.2,.8)],cs:[R(.15,.4),R(.15,.4),R(.15,.4)],
   ridge:Array.from({length:5},(_,i)=>({b:.45+i*.1,a:R(.03,.1),f:R(2,6),s:R(.05,.3)*(i+1)*(r()<.5?-1:1),p:R(0,6)}))}},
 pal(f,i){const P=this.P;return[0,1,2].map(c=>255*clamp(P.pa[c]+P.pb[c]*Math.cos(6.2832*(P.pc[c]*f+P.pd[c]+i)),0,1))},
 frame(dt){this.t+=dt*this.speed;const t=this.t,W=this.W,H=this.H,P=this.P,d=this.img.data,asp=W/H;let k=0;
  for(let y=0;y<H;y++){const v=y/H;for(let x=0;x<W;x++){const u=x/W;let c;
   if(this.style===0){const f=Math.sin(u*P.fx*asp+Math.sin(v*P.fy+t*P.s1)*P.wa+t*P.s2)+Math.sin(v*P.gx+Math.sin(u*P.gy*asp-t*P.s3)*P.wb)+Math.sin((u+v)*4+t*.2);c=this.pal(f*.25+.5,0)}
   else if(this.style===1){let f=0;for(let i=0;i<3;i++){const cx=P.cx[i]+Math.sin(t*P.s1*(i+1)+i)*.25,cy=P.cy[i]+Math.cos(t*P.s2*(i+1)+i*2)*.25;const dd=Math.hypot((u-cx)*asp,v-cy);f+=Math.sin(dd/P.cs[i]*3-t*.6*(i+1))*(1/(1+dd*3))}c=this.pal(f*.3+.5,v*.3)}
   else{let col=this.pal(1-v*.9,0);col=col.map(q=>q*.6+60);let hit=-1;for(let i=P.ridge.length-1;i>=0;i--){const g=P.ridge[i];const h=g.b+g.a*Math.sin(u*g.f*asp+t*g.s+g.p)+g.a*.5*Math.sin(u*g.f*2.7*asp-t*g.s*.7);if(v>h){hit=i}}
    if(hit>=0){const sh=hit/P.ridge.length;const m=this.pal(.2+sh*.6,.5);col=m.map(q=>q*(.35+.65*sh))}c=col}
   const vg=1-.45*Math.hypot(u-.5,v-.5);d[k++]=c[0]*vg;d[k++]=c[1]*vg;d[k++]=c[2]*vg;d[k++]=255}}
  this.ctx.putImageData(this.img,0,0)}};
Wall.setup();
(function wl(){let last=performance.now();(function loop(n){Wall.frame(Math.min(.1,(n-last)/1000));last=n;requestAnimationFrame(loop)})(last)})();

/* ---------------- Window manager ---------------- */
const WM={wins:new Map(),z:10,focused:null,nid:1,restoring:false,apps:{},
 register(id,def){this.apps[id]=def},
 open(appId,o={}){const def=this.apps[appId];if(!def)return;
  if(def.single){for(const w of this.wins.values())if(w.app===appId){this.unmin(w.id);this.focus(w.id);return w}}
  const id=o.id||('w'+this.nid++);if(o.id)this.nid=Math.max(this.nid,+o.id.slice(1)+1);
  const n=this.wins.size;const W=innerWidth,H=innerHeight-48;
  const w={id,app:appId,x:o.x??clamp(70+n*28,0,W-300),y:o.y??clamp(40+n*28,0,H-200),w:o.w??Math.min(def.w||640,W-20),h:o.h??Math.min(def.h||440,H-20),min:!!o.min,max:!!o.max,z:o.z||++this.z};
  const body=el('div',{class:'body'}),tb=el('div',{class:'tb'});
  w.title=el('span',{class:'t'},def.icon+'  '+def.title);
  const bMin=el('button',{title:'Minimize'},'–'),bMax=el('button',{title:'Maximize'},'▢'),bX=el('button',{class:'x',title:'Close'},'✕');
  tb.append(w.title,bMin,bMax,bX);
  w.rs=el('div',{class:'rs'});w.el=el('div',{class:'win'},tb,body,w.rs);
  $('#desktop').append(w.el);w.body=body;this.wins.set(id,w);this.apply(w);
  this.drag(w,tb);this.resize(w);
  w.el.addEventListener('pointerdown',()=>this.focus(id),true);
  bMin.onclick=()=>this.minimize(id);bMax.onclick=()=>this.toggleMax(id);bX.onclick=()=>this.close(id);
  tb.ondblclick=e=>{if(e.target===tb||e.target===w.title)this.toggleMax(id)};
  w.ro=new ResizeObserver(()=>{if(w.inst&&w.inst.resize)w.inst.resize(body.clientWidth,body.clientHeight)});w.ro.observe(body);
  w.inst=def.create(body,w)||{};
  this.focus(id);this.tasks();if(!this.restoring)Rewind.record('Opened '+def.title);return w},
 apply(w){const s=w.el.style;if(w.max){s.left=s.top='0';s.width='100%';s.height='100%'}else{s.left=w.x+'px';s.top=w.y+'px';s.width=w.w+'px';s.height=w.h+'px'}
  w.el.classList.toggle('max',w.max);w.el.classList.toggle('min',w.min);s.zIndex=w.z},
 focus(id){const w=this.wins.get(id);if(!w)return;if(this.focused!==id||w.z<this.z){w.z=++this.z}this.focused=id;for(const x of this.wins.values()){x.el.classList.toggle('focus',x.id===id);x.el.style.zIndex=x.z}this.tasks()},
 minimize(id){const w=this.wins.get(id);w.min=true;this.apply(w);if(this.focused===id)this.focused=null;this.tasks();if(!this.restoring)Rewind.record('Minimized '+this.apps[w.app].title)},
 unmin(id){const w=this.wins.get(id);if(w.min){w.min=false;this.apply(w)}},
 toggleMax(id){const w=this.wins.get(id);w.max=!w.max;this.apply(w);if(!this.restoring)Rewind.record((w.max?'Maximized ':'Restored ')+this.apps[w.app].title)},
 close(id,quiet){const w=this.wins.get(id);if(!w)return;if(w.inst&&w.inst.destroy)w.inst.destroy();w.ro.disconnect();w.el.remove();this.wins.delete(id);if(this.focused===id)this.focused=null;this.tasks();if(!quiet&&!this.restoring)Rewind.record('Closed '+this.apps[w.app].title)},
 drag(w,tb){tb.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON'||w.max)return;const sx=e.clientX-w.x,sy=e.clientY-w.y;tb.setPointerCapture(e.pointerId);tb.style.cursor='grabbing';
  const mv=ev=>{w.x=clamp(ev.clientX-sx,-w.w+80,innerWidth-80);w.y=clamp(ev.clientY-sy,0,innerHeight-100);this.apply(w)};
  const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up);tb.style.cursor='';Rewind.record('Moved '+this.apps[w.app].title)};
  tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up)})},
 resize(w){w.rs.addEventListener('pointerdown',e=>{if(w.max)return;e.stopPropagation();this.focus(w.id);const sx=e.clientX,sy=e.clientY,ow=w.w,oh=w.h;w.rs.setPointerCapture(e.pointerId);
  const mv=ev=>{w.w=Math.max(260,ow+ev.clientX-sx);w.h=Math.max(180,oh+ev.clientY-sy);this.apply(w)};
  const up=()=>{w.rs.removeEventListener('pointermove',mv);w.rs.removeEventListener('pointerup',up);Rewind.record('Resized '+this.apps[w.app].title)};
  w.rs.addEventListener('pointermove',mv);w.rs.addEventListener('pointerup',up)})},
 tasks(){const t=$('#tasks');t.replaceChildren(...[...this.wins.values()].map(w=>el('button',{class:'tbtn'+(this.focused===w.id&&!w.min?' on':''),onclick:()=>{if(w.min){this.unmin(w.id);this.focus(w.id)}else if(this.focused===w.id)this.minimize(w.id);else this.focus(w.id)}},this.apps[w.app].icon+' '+this.apps[w.app].title)))},
 layout(){return[...this.wins.values()].filter(w=>w.app!=='rewind').map(w=>({id:w.id,app:w.app,x:w.x,y:w.y,w:w.w,h:w.h,min:w.min,max:w.max,z:w.z}))}};
addEventListener('resize',()=>{for(const w of WM.wins.values()){w.x=clamp(w.x,-w.w+80,innerWidth-80);w.y=clamp(w.y,0,innerHeight-100);WM.apply(w)}});
const keys=new Set();
addEventListener('keydown',e=>{keys.add(e.code);const w=WM.wins.get(WM.focused);if(w&&WM.apps[w.app].game&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
 if(e.altKey&&e.code==='KeyZ'){WM.open('rewind');e.preventDefault()}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
const focusedApp=()=>{const w=WM.wins.get(WM.focused);return w&&!w.min?w.app:null};

/* ---------------- Rewind: the "special" feature ----------------
   Every window action is recorded on a timeline (with the Notes text).
   Open the Rewind app (or press Alt+Z) and scrub the slider to travel back in time:
   your whole desktop re-arranges itself as it was. "Resume from here" makes that moment the present. */
const Rewind={hist:[],idx:-1,paused:false,notes:store.get('notes',"Welcome to AetherOS!\n\nTry Alt+Z: Rewind lets you scrub your whole desktop back in time.\n"),ui:null,timer:null,
 record(label){if(this.paused||WM.restoring)return;const s={t:Date.now(),label,wins:WM.layout(),notes:this.notes,focused:WM.focused};
  if(this.idx<this.hist.length-1)this.hist.length=this.idx+1;this.hist.push(s);if(this.hist.length>400)this.hist.shift();this.idx=this.hist.length-1;this.refresh()},
 go(i){if(!this.hist.length)return;i=clamp(i|0,0,this.hist.length-1);const s=this.hist[i];this.idx=i;this.paused=true;WM.restoring=true;
  const want=new Map(s.wins.map(w=>[w.id,w]));
  for(const w of [...WM.wins.values()])if(w.app!=='rewind'&&!want.has(w.id))WM.close(w.id,true);
  for(const o of s.wins){let w=WM.wins.get(o.id);if(!w)w=WM.open(o.app,o);Object.assign(w,{x:o.x,y:o.y,w:o.w,h:o.h,min:o.min,max:o.max,z:o.z});WM.apply(w)}
  WM.z=Math.max(WM.z,...s.wins.map(w=>w.z),10);WM.focused=s.focused&&WM.wins.has(s.focused)?s.focused:null;
  for(const w of WM.wins.values())w.el.classList.toggle('focus',w.id===WM.focused);
  this.notes=s.notes;if(this.notesEl)this.notesEl.value=s.notes;WM.tasks();WM.restoring=false;this.refresh()},
 resume(){this.paused=false;if(this.idx<this.hist.length-1)this.hist.length=this.idx+1;this.record('Resumed from rewind');toast('Timeline resumed')},
 play(){clearInterval(this.timer);if(this.timer){this.timer=null;this.refresh();return}let i=this.idx>=this.hist.length-1?0:this.idx;this.timer=setInterval(()=>{if(i>=this.hist.length){clearInterval(this.timer);this.timer=null;this.paused=false;this.refresh();return}this.go(i++)},350);this.refresh()},
 refresh(){if(this.ui)this.ui()},
 saveNotes(v){this.notes=v;store.set('notes',v);clearTimeout(this.nt);this.nt=setTimeout(()=>this.record('Edited notes'),900)}};

/* ---------------- Apps ---------------- */
const A=(id,def)=>WM.register(id,def);

A('messages',{title:'Messages',icon:'💬',w:760,h:480,single:true,create(body){

 const env={fog:[.02,.02,.07],sun:[.5,.7,.3],sunCol:[.55,.5,.45],amb:[.42,.44,.6],fogR:[400,1200]};
 const G=24;
 function gravityAt(p){let g=[0,0,0],best=null,bd=1e9;for(const pl of planets){const d=V.sub(pl.c,p),l=V.len(d),f=G*(pl.r/l)*(pl.r/l)*(l<pl.r*4?1:Math.pow(pl.r*4/l,2));g=V.add(g,V.scl(d,f/l));if(l-pl.r<bd){bd=l-pl.r;best=pl}}return{g,best,bd}}
 function respawn(){st.p=V.add(home.c,[0,home.r+1,0]);st.v=[0,0,0];st.planet=home;say('Lost in space! Back home.')}
 function update(dt){st.t+=dt;if(!st.done)st.time+=dt;st.msgT-=dt;
  const {g,best,bd}=gravityAt(st.p);const gl=V.len(g)||1;
  let up=V.scl(g,-1/gl);
  // smooth the up vector so crossing between gravity wells doesn't snap the camera
  st.up=V.norm(V.lerp(st.up,up,Math.min(1,dt*(st.ground?14:5))));
  const U=st.up;
  // keep forward tangent to the new up (parallel transport) and apply turning
  let f=V.sub(st.fwd,V.scl(U,V.dot(st.fwd,U)));if(V.len(f)<.01)f=V.cross(U,[1,0,0]);f=V.norm(f);
  const turn=((S.down('KeyA')||S.down('ArrowLeft'))?1:0)-((S.down('KeyD')||S.down('ArrowRight'))?1:0);const ang=turn*2.4*dt-S.mouse.dx*.006;
  if(ang){const c=Math.cos(ang),s=Math.sin(ang);f=V.norm(V.add(V.scl(f,c),V.scl(V.cross(U,f),s)))}
  st.fwd=f;const R=V.cross(f,U);
  const fw=((S.down('KeyW')||S.down('ArrowUp'))?1:0)-((S.down('KeyS')||S.down('ArrowDown'))?1:0);
  const vr=V.dot(st.v,U),vt=V.sub(st.v,V.scl(U,vr));
  if(st.ground){st.coyote=.12;const want=V.scl(f,fw*(S.down('ShiftLeft')?15:10));const k=Math.min(1,dt*10);st.v=V.add(V.scl(U,vr),V.lerp(vt,want,k))}
  else{st.coyote-=dt;if(fw){st.v=V.add(st.v,V.scl(f,fw*9*dt))}}
  let thrust=false;
  if(S.hit('Space')&&st.coyote>0){st.v=V.add(st.v,V.scl(U,13));st.ground=false;st.coyote=0;st.jumpGrace=.2;Snd.tone(300,.2,'square',.12,300)}
  else if(!st.ground&&S.down('Space')&&st.fuel>0){st.v=V.add(st.v,V.scl(U,34*dt));thrust=true}
  if(!st.ground&&(S.down('ShiftLeft')||S.down('ShiftRight'))&&st.fuel>0){st.v=V.add(st.v,V.scl(V.norm(V.add(V.scl(f,.8),V.scl(U,.35))),42*dt));thrust=true}
  st.thr=thrust?1:0;if(thrust){st.fuel=Math.max(0,st.fuel-32*dt);if(Math.random()<dt*20)Snd.burst(1200,.08,.12)}else if(st.ground)st.fuel=Math.min(100,st.fuel+55*dt);
  st.jumpGrace-=dt;st.v=V.add(st.v,V.scl(g,dt));
  const sp=V.len(st.v);if(sp>46)st.v=V.scl(st.v,46/sp);
  st.p=V.add(st.p,V.scl(st.v,dt));
  // planet collision (feet on the surface)
  st.ground=false;for(const pl of planets){const d=V.sub(st.p,pl.c),l=V.len(d);if(l<pl.r){const n=V.scl(d,1/l);st.p=V.add(pl.c,V.scl(n,pl.r));const vn2=V.dot(st.v,n);if(vn2<0){if(vn2<-14)Snd.burst(500,.15,.25);st.v=V.sub(st.v,V.scl(n,vn2))}
    if(st.jumpGrace<=0){st.ground=true;st.planet=pl}}}
  if(st.ground&&best&&bd>.6){st.ground=false}
  if(bd>170)respawn();
  for(const gm of gems){if(gm.got)continue;if(V.len(V.sub(gm.p,V.add(st.p,V.scl(U,1.2))))<2.6){gm.got=true;st.got++;Snd.tone(660+st.got*18,.25,'triangle',.28,600);say(st.got+' / 24 crystals');if(st.got===24){st.done=true;say('All crystals! Time '+st.time.toFixed(1)+'s')}}}
  S.edge.clear()}
 let camP=[0,0,0],camUp=[0,1,0];
 function render(){const U=st.up,f=st.fwd;camUp=V.norm(V.lerp(camUp,U,.2));
  const eye=V.add(V.add(st.p,V.scl(U,5)),V.scl(f,-9)),tgt=V.add(st.p,V.add(V.scl(U,1.5),V.scl(f,4)));
  E.begin({eye,target:tgt,up:U,fov:1.05,far:1500},env);E.draw(skyM,T3(st.p));for(const p of planets)E.draw(p.mesh,T3(p.c));
  for(const gm of gms()){const bob=Math.sin(st.t*2+gm.p[0])*.5,y=gm.p;const c=Math.cos(st.t*1.5),s=Math.sin(st.t*1.5);E.draw(crystalM,M4.basis([c,0,-s],[0,1,0],[s,0,c],[y[0],y[1]+bob,y[2]],gm.float?[1.6,1.6,1.6]:[1,1,1]),gm.float?[1,.6+Math.sin(st.t*5)*.3,1]:[1,1,1])}
  const m=M4.basis(V.scl(R_(),-1),U,f,st.p);E.draw(bodyM,m);if(st.thr)E.draw(flameM,M4.basis(R_(),U,f,V.add(st.p,V.scl(U,.2)),[1,1.5+Math.random(),1]),[1,.8,.4])}
 const R_=()=>V.cross(st.fwd,st.up),gms=()=>gems.filter(g=>!g.got);
 const proj=(x,y,z)=>{const m=E.vp,w=m[3]*x+m[7]*y+m[11]*z+m[15];if(w<=.1)return null;return[(((m[0]*x+m[4]*y+m[8]*z+m[12])/w)*.5+.5)*S.w,(1-(((m[1]*x+m[5]*y+m[9]*z+m[13])/w)*.5+.5))*S.h]};
 function hud(g,W,H){const stroke=(t,x,y,f='700 16px system-ui',col='#fff',al='left')=>{g.font=f;g.textAlign=al;g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.7)';g.strokeText(t,x,y);g.fillStyle=col;g.fillText(t,x,y)};
  stroke('◆ '+st.got+' / 24',16,34,'800 26px system-ui','#7ff');stroke(st.time.toFixed(1)+'s',16,60,'600 16px system-ui','#fff');
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(16,70,160,10);g.fillStyle=st.fuel>20?'#ffb347':'#ef4444';g.fillRect(17,71,158*st.fuel/100,8);stroke('FUEL',184,80,'700 11px system-ui','#fff');
  // nearest crystal pointer
  let nb=null,nd=1e9;for(const gm of gems)if(!gm.got){const d=V.len(V.sub(gm.p,st.p));if(d<nd){nd=d;nb=gm}}
  if(nb){const p=proj(...nb.p);if(p&&p[0]>20&&p[0]<W-20&&p[1]>20&&p[1]<H-20){stroke('▼ '+Math.round(nd)+'m',p[0],p[1]-14,'700 14px system-ui','#7ff','center')}
   else{const dir=V.sub(nb.p,st.p),x=V.dot(dir,R_()),y=V.dot(dir,st.up),a=Math.atan2(-y*.3,-x);stroke((x>0?'◀':'▶')+' '+Math.round(nd)+'m',x>0?W-70:70,H/2,'700 16px system-ui','#7ff','center')}}
  if(st.msgT>0)stroke(st.msg,W/2,H*.2,'800 24px system-ui','#fff','center');
  stroke('W/S run · A/D turn · Space jump (hold: jetpack) · Shift boost',W/2,H-14,'600 12px system-ui','rgba(255,255,255,.7)','center');
  if(st.done){g.fillStyle='rgba(0,0,30,.6)';g.fillRect(0,0,W,H);stroke('ALL CRYSTALS COLLECTED',W/2,H/2-10,'900 40px system-ui','#7ff','center');stroke(st.time.toFixed(1)+'s · keep exploring, or close the window',W/2,H/2+30,'600 18px system-ui','#fff','center')}}
 return{update,render,hud,idle(){},destroy(){for(const p of planets)E.free(p.mesh);for(const m of [skyM,crystalM,bodyM,flameM])E.free(m)}}}

/* ---------------- Desktop, start menu, clock, boot ---------------- */
const accent=store.get('accent',null);if(accent)document.documentElement.style.setProperty('--accent',accent);
const ORDER=['gta','hop','messages','notes','terminal','calc','paint','rewind','settings'];
$('#icons').append(...ORDER.map(id=>{const d=WM.apps[id];return el('div',{class:'icon',ondblclick:()=>WM.open(id),onclick:e=>{if(matchMedia('(pointer:coarse)').matches)WM.open(id)},title:d.title},el('div',{class:'g'},d.icon),el('span',{},d.title))}));
const menu=$('#menu');menu.append(el('h4',{},'Applications'),...ORDER.map(id=>{const d=WM.apps[id];return el('div',{class:'it',onclick:()=>{WM.open(id);menu.classList.remove('open')}},el('span',{style:'font-size:22px'},d.icon),el('span',{},d.title))}));
$('#start').onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};
addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target.id!=='start')menu.classList.remove('open')});
const tick=()=>{const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString([],{month:'short',day:'numeric'})};tick();setInterval(tick,10000);
Rewind.record('Boot');
WM.open('messages',{x:90,y:50});
toast('Welcome to AetherOS · double-click an icon · Alt+Z rewinds time');
</script>
