[project]
name = "everyai-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "bcrypt>=4.3.0",
    "fastapi>=0.162.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.14.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
